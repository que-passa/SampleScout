name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check
        run: npm run check

      - name: Unit tests
        run: npm run test:ci

      - name: Build
        env:
          # Set to /<repo> for project Pages sites; leave empty for user sites.
          BASE_PATH: /${{ github.event.repository.name }}
          PUBLIC_AUDIOTOOL_CLIENT_ID: ${{ vars.PUBLIC_AUDIOTOOL_CLIENT_ID }}
          PUBLIC_AUDIOTOOL_REDIRECT_URL: ${{ vars.PUBLIC_AUDIOTOOL_REDIRECT_URL }}
          PUBLIC_AUDIOTOOL_SCOPES: ${{ vars.PUBLIC_AUDIOTOOL_SCOPES }}
          PUBLIC_SENTRY_DSN: ${{ vars.PUBLIC_SENTRY_DSN }}
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
